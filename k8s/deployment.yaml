apiVersion: apps/v1
kind: Deployment
metadata:
  name: spiderfoot
  namespace: spiderfoot
spec:
  replicas: 1
  selector:
    matchLabels: { app: spiderfoot }
  template:
    metadata:
      labels: { app: spiderfoot }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spiderfoot
          image: joshuapfritz/spiderfoot
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5001
          # SpiderFoot has a built-in SQLite DB; persist the app dir to keep scans/config.
          env:
            - name: HOME
              value: /data

          volumeMounts:
            - name: data
              mountPath: /data
          # Basic health checks—UI returns 200 on "/"
          readinessProbe:
            httpGet: { path: "/", port: 5001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 5001 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: spiderfoot-data
