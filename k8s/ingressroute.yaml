apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: spiderfoot
  namespace: spiderfoot
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`spiderfoot.example.com`)
      kind: Rule
      services:
        - name: spiderfoot
          port: 5001
  tls: {}  # Add TLS here or Terminate TLS upstream
